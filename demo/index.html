<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Showandtell — capture demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#222b28;font:18px system-ui}main{max-width:1000px;margin:8vh auto;padding:40px}header{display:flex;align-items:center;gap:12px;font-weight:700}i{background:#305d49;color:white;border-radius:12px;padding:10px;font-style:normal}h1{font-size:60px;letter-spacing:-3px;margin:45px 0 16px}p{color:#69726c;line-height:1.6}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0}button{background:white;border:2px solid #d9ded8;border-radius:18px;padding:28px;text-align:left;font:inherit;cursor:pointer;color:inherit}button strong{font-size:26px;display:block;margin-bottom:10px}button[aria-pressed=true]{border-color:#305d49;background:#e8f0e7}#export{background:#305d49;color:white;padding:16px 28px;border:0;border-radius:12px}#status{min-height:40px;font-weight:600}.tag{font-size:13px;letter-spacing:2px;color:#69726c}
</style>
<main><header><i>↗</i> showandtell</header><h1>Every action.<br>A story worth showing.</h1><p>Choose a look, then create your walkthrough.</p><div class="cards"><button id="calm" aria-pressed="false"><strong>Calm</strong>Soft colors. Clear focus.</button><button id="bold" aria-pressed="false"><strong>Bold</strong>Bright ideas. Big moves.</button></div><button id="export">Create walkthrough →</button><p id="status" aria-live="polite">Ready when you are.</p><span class="tag">LOCAL TEST PAGE · NO DATA LEAVES THIS PAGE</span></main>
<script>
let look='Calm';for(const id of ['calm','bold'])document.getElementById(id).onclick=()=>{look=id==='calm'?'Calm':'Bold';for(const other of ['calm','bold'])document.getElementById(other).setAttribute('aria-pressed',String(other===id));document.getElementById('status').textContent=look+' selected.'};document.getElementById('export').onclick=()=>document.getElementById('status').textContent='Your '+look.toLowerCase()+' walkthrough is ready. ✓';
</script></html>
